# Supabase CLI configuration (project_id names the local stack only).
# There is NO local stack in this repo (decision D016 — no Docker): the linked
# hosted project is the production promotion target. This file stays as the
# migration-tooling + auth-intent reference; hosted auth/site-url settings are
# managed with `supabase config push` (Management API) or the Supabase dashboard. See
# docs/setup-supabase.md.
project_id = "questcite"

[api]
enabled = true
port = 54321
# Public schema only: RLS and grants are authored explicitly per table (plan §12).
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15
shadow_port = 54320

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

[auth]
site_url = "https://questcite.netlify.app"
additional_redirect_urls = ["https://questcite.netlify.app/auth/callback", "http://localhost:3000/auth/callback", "http://localhost:3100/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
file_size_limit = "50MiB"

[analytics]
enabled = false
