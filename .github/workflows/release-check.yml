name: Release check

# Full gate before any release artifact is built (Weeks 9–10) and on demand.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  release-gate:
    name: Full release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Clean install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests + coverage
        run: pnpm test:coverage

      - name: AI safety corpus (offline)
        run: pnpm test:ai:offline

      - name: Browser e2e + a11y
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
          pnpm test:a11y

      - name: Production build
        run: pnpm build

      - name: Secret scan
        run: pnpm scan:secrets

      - name: Release audit
        run: pnpm audit:release

  browser-hardening:
    name: Browser matrix + visual regression
    runs-on: windows-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://127.0.0.1:3100' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Clean install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium and Firefox
        run: pnpm exec playwright install chromium firefox

      - name: Browser hardening matrix
        run: pnpm test:matrix

      - name: Visual regression
        run: pnpm test:visual
